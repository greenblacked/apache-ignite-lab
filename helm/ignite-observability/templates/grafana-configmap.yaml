{{- if .Values.grafana.enabled }}
{{- $name := include "obs.grafanaName" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-provisioning
  labels:
    {{- include "obs.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  datasource.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "obs.prometheusName" . }}:{{ .Values.prometheus.port }}
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: {{ .Values.prometheus.scrapeIntervalSeconds }}s
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: Ignite Lab
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-dashboards
  labels:
    {{- include "obs.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  # Copied from ops/grafana/dashboards/; CI fails if the two drift.
  {{- (.Files.Glob "dashboards/*.json").AsConfig | nindent 2 }}
{{- end }}

# Persistent storage and a longer retention window.
exporter:
  replicaCount: 2

prometheus:
  retention: 30d
  persistence:
    enabled: true
    size: 100Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 4Gi

grafana:
  # Create this Secret out of band; it must hold an "admin-password" key.
  existingSecret: grafana-admin
  persistence:
    enabled: true
    size: 10Gi
    storageClass: fast-ssd

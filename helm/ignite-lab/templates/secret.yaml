{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ignite-lab.fullname" . }}-auth
  labels:
    {{- include "ignite-lab.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Default lab credential. Override with auth.password or auth.existingSecret.
  password: {{ .Values.auth.password | quote }}
{{- end }}

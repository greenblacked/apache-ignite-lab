apiVersion: v1
kind: Service
metadata:
  name: {{ include "ignite-lab.headless" . }}
  labels:
    {{- include "ignite-lab.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Peers must resolve each other before they are Ready, otherwise the cluster
  # can never form.
  publishNotReadyAddresses: true
  selector:
    {{- include "ignite-lab.selectorLabels" . | nindent 4 }}
  ports:
    - name: cluster
      port: {{ .Values.ports.cluster }}
      targetPort: cluster
    - name: rest
      port: {{ .Values.ports.rest }}
      targetPort: rest
    - name: client
      port: {{ .Values.ports.client }}
      targetPort: client

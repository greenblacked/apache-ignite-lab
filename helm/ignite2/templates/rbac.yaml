{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ignite2.fullname" . }}
  labels:
    {{- include "ignite2.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ignite2.fullname" . }}
  labels:
    {{- include "ignite2.labels" . | nindent 4 }}
rules:
  # TcpDiscoveryKubernetesIpFinder finds peers by reading the Endpoints of the
  # headless Service. This is the only API access Ignite needs.
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ignite2.fullname" . }}
  labels:
    {{- include "ignite2.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ignite2.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ignite2.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ignite2.fullname" . }}-config
  labels:
    {{- include "ignite2.labels" . | nindent 4 }}
data:
  ignite-config.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <beans xmlns="http://www.springframework.org/schema/beans"
           xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
           xsi:schemaLocation="
            http://www.springframework.org/schema/beans
            http://www.springframework.org/schema/beans/spring-beans.xsd">

      <bean class="org.apache.ignite.configuration.IgniteConfiguration">
        <!-- Set from the pod name, so a restarted pod keeps its identity. -->
        <property name="consistentId" value="#{systemProperties['IGNITE_NODE_NAME']}"/>
        <property name="authenticationEnabled" value="{{ .Values.auth.enabled }}"/>

        <property name="dataStorageConfiguration">
          <bean class="org.apache.ignite.configuration.DataStorageConfiguration">
            <property name="defaultDataRegionConfiguration">
              <bean class="org.apache.ignite.configuration.DataRegionConfiguration">
                <property name="name" value="Default_Region"/>
                <property name="persistenceEnabled" value="{{ .Values.dataRegion.persistenceEnabled }}"/>
                <property name="maxSize" value="{{ int64 .Values.dataRegion.maxSizeBytes }}"/>
              </bean>
            </property>
          </bean>
        </property>

        <property name="discoverySpi">
          <bean class="org.apache.ignite.spi.discovery.tcp.TcpDiscoverySpi">
            <property name="ipFinder">
              <!--
                Peers are discovered from the headless Service's Endpoints.
                That Service sets publishNotReadyAddresses, so pods starting in
                parallel can still see each other and form one cluster.
              -->
              <bean class="org.apache.ignite.spi.discovery.tcp.ipfinder.kubernetes.TcpDiscoveryKubernetesIpFinder">
                <property name="namespace" value="{{ .Release.Namespace }}"/>
                <property name="serviceName" value="{{ include "ignite2.headless" . }}"/>
              </bean>
            </property>
          </bean>
        </property>

        <property name="connectorConfiguration">
          <bean class="org.apache.ignite.configuration.ConnectorConfiguration">
            <property name="host" value="0.0.0.0"/>
          </bean>
        </property>

        <property name="clientConnectorConfiguration">
          <bean class="org.apache.ignite.configuration.ClientConnectorConfiguration">
            <property name="host" value="0.0.0.0"/>
            <property name="port" value="{{ .Values.ports.client }}"/>
          </bean>
        </property>
      </bean>
    </beans>

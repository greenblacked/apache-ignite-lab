# Three nodes spread across hosts, real disks, PDB.
# helm install ignite2 ./helm/ignite2 -f helm/ignite2/values-prod.yaml
replicaCount: 3

jvm:
  heap: 4g

dataRegion:
  # 8 GiB off-heap; limits.memory must stay above heap + this.
  maxSizeBytes: 8589934592

persistence:
  enabled: true
  size: 100Gi
  storageClass: fast-ssd

resources:
  requests:
    cpu: "2"
    memory: 16Gi
  limits:
    memory: 16Gi

auth:
  # Create this Secret out of band; it must hold a "password" key.
  existingSecret: ignite2-credentials

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - ignite2
        topologyKey: kubernetes.io/hostname

podDisruptionBudget:
  enabled: true
  minAvailable: 2

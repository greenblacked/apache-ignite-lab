---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ignite3-config
  labels:
    app.kubernetes.io/name: ignite-lab
    app.kubernetes.io/instance: ignite3
    app.kubernetes.io/version: "3.1.0"
data:
  # HOCON node config. An init container copies this to a writable path because
  # Ignite merges defaults back into the file at startup. Peers are addressed
  # through the headless Service, which gives every pod a stable DNS name.
  ignite-config.conf: |
    ignite {
      network {
        port: 3344
        nodeFinder.netClusterNodes = [
          "ignite3-0.ignite3-headless:3344"
          , "ignite3-1.ignite3-headless:3344"
          , "ignite3-2.ignite3-headless:3344"
        ]
      }
      storage {
        profiles = [
          { name = rocksDbProfile, engine = rocksdb }
        ]
      }
    }

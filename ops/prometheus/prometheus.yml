global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

# Alert rules for the lab exporter's metrics. No Alertmanager is configured,
# so firing alerts surface at http://127.0.0.1:9090/alerts.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: ignite-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - ignite-exporter:8000

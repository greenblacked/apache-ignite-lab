services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    networks: [monitoring-lab]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.external-url=http://127.0.0.1:9091/
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  prometheus-data:

networks:
  monitoring-lab:
    name: ${MONITORING_LAB_NETWORK:-monitoring-lab}
    external: true

